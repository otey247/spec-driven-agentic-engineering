[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-driven-agentic-engineering-reference"
version = "1.0.0"
description = "Runnable spec-driven agentic engineering reference: approval workflow and enforced acceptance gates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.120,<1.0", "uvicorn>=0.35,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["reviewflow*"]

[tool.setuptools.package-data]
reviewflow = ["schema.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requirement(id): associates the test with a specified requirement ID"]
addopts = "-ra"
